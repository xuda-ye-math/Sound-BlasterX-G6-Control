<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">G6 Control tray icon</title>
  <desc id="desc">A compact sharp red four-point flare with a dark outline.</desc>
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4359"/>
      <stop offset="0.48" stop-color="#f20d32"/>
      <stop offset="1" stop-color="#970018"/>
    </linearGradient>
  </defs>
  <!-- The outline keeps the mark visible on light and dark panels. -->
  <path d="M32 25 57 3 39 31 59 61 33 39 6 61 25 33 3 3 31 25z"
        fill="none" stroke="#111318" stroke-width="5" stroke-linejoin="miter"/>
  <path d="M32 25 57 3 39 31 59 61 33 39 6 61 25 33 3 3 31 25z"
        fill="url(#red)"/>
  <path d="M32 27 37 32 32 37 27 32z" fill="#ffd0cb"/>
</svg>
