[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Xuda Ye", "Claude Code"]

[workspace.dependencies]
anyhow     = "1"
clap       = { version = "4", features = ["derive"] }
eframe     = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
hidapi     = { version = "2", default-features = false, features = ["linux-static-libusb"] }
rusb       = "0.9"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
g6-core    = { path = "crates/g6-core" }
