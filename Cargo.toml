[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Xuda Ye", "Claude Code"]

[workspace.dependencies]
anyhow               = "1"
clap                 = { version = "4", features = ["derive"] }
# X11 only, deliberately: winit cannot unmap a Wayland window
# (`set_visible` is a no-op there), so hide-to-tray leaves the close button
# dead under KDE/GNOME Wayland. The tray mixer popup is an X11 window too.
eframe               = { version = "0.34.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
epaint_default_fonts = "0.34"
fontdue              = "0.9"
hidapi               = { version = "2", default-features = false, features = ["linux-static-libusb"] }
ksni                 = { version = "0.3.6", features = ["blocking"] }
rusb                 = "0.9"
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
x11rb                = { version = "0.13", features = ["image"] }
g6-core              = { path = "crates/g6-core" }
